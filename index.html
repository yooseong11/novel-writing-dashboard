<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="소설 집필 글자 수 기록" />
    <title>집필 기록</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
      :root { color-scheme: light; --ink: #251b25; --muted: #786d78; --paper: #fffaf5; --card: #ffffff; --line: #eadfdb; --purple: #7650c8; --orange: #ea7c54; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; background: radial-gradient(circle at 90% 0, #f6e6dc 0, transparent 34rem), var(--paper); color: var(--ink); font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(1080px, calc(100% - 32px)); margin: 0 auto; padding: 68px 0 52px; }
      .site-nav { display: flex; gap: 18px; margin-bottom: 46px; font-size: .87rem; }
      .site-nav a { color: var(--muted); text-decoration: none; }
      .site-nav a:hover, .site-nav a[aria-current="page"] { color: var(--ink); font-weight: 700; }
      header { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 36px; }
      h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(2.3rem, 7vw, 4.5rem); font-weight: 500; letter-spacing: -0.065em; }
      .eyebrow, .updated { color: var(--muted); font-size: .9rem; }
      .eyebrow { margin: 0 0 8px; letter-spacing: .08em; text-transform: uppercase; }
      .updated { margin: 0 0 8px; text-align: right; }
      .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 38px; }
      .metric, .chart-area, .entries { background: color-mix(in srgb, var(--card) 88%, transparent); border: 1px solid var(--line); }
      .metric { min-height: 126px; padding: 21px; }
      .metric span { display: block; color: var(--muted); font-size: .87rem; }
      .metric strong { display: block; margin-top: 13px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(1.6rem, 3vw, 2.4rem); font-weight: 500; letter-spacing: -.04em; }
      .metric strong small { font-family: inherit; font-size: .55em; color: var(--muted); }
      .section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin: 0 0 13px; }
      h2 { margin: 0; font-size: 1rem; font-weight: 650; }
      .period { color: var(--muted); font-size: .84rem; }
      .chart-controls { display: flex; align-items: center; gap: 10px; }
      .month-select { appearance: none; border: 1px solid var(--line); border-radius: 0; background: var(--card); color: var(--ink); cursor: pointer; font: inherit; font-size: .87rem; padding: 8px 28px 8px 10px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 14px) 13px, calc(100% - 10px) 13px; background-size: 4px 4px, 4px 4px; background-repeat: no-repeat; }
      .chart-area { padding: 18px 18px 14px; min-height: 360px; }
      .chart-wrap { height: 300px; position: relative; }
      .entries-section { margin-top: 38px; }
      .entries { overflow: hidden; }
      .day-group { border-top: 1px solid var(--line); }
      .day-group:first-child { border-top: 0; }
      .day-date { display: flex; align-items: baseline; gap: 8px; margin: 0; padding: 16px 20px 8px; color: var(--ink); font-size: .91rem; font-weight: 700; }
      .praise { font-family: Georgia, "Times New Roman", serif; font-size: .82rem; font-weight: 500; letter-spacing: .02em; }
      .praise.good { color: #b36b28; }
      .praise.great { color: #42806e; }
      .praise.excellent { color: #3179a8; }
      .praise.perfect { color: var(--purple); }
      .praise.marvelous { color: #b04472; }
      .entry { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; padding: 7px 20px; }
      .day-group .entry:last-child { padding-bottom: 16px; }
      .entry .commit { color: var(--muted); font-size: .88rem; }
      .entry .words { font-weight: 700; color: var(--purple); font-variant-numeric: tabular-nums; }
      .empty { color: var(--muted); text-align: center; padding: 76px 20px; }
      footer { color: var(--muted); font-size: .8rem; margin-top: 24px; }
      @media (max-width: 700px) { main { width: min(100% - 24px, 1080px); padding-top: 30px; } .site-nav { margin-bottom: 32px; } header { display: block; } .updated { text-align: left; margin-top: 15px; } .summary { grid-template-columns: repeat(2, 1fr); } .metric { min-height: 108px; padding: 17px; } .section-title { align-items: flex-start; flex-wrap: wrap; } .chart-area { padding: 14px 9px 12px; } .day-date, .entry { padding-left: 14px; padding-right: 14px; } }
    </style>
  </head>
  <body>
    <main>
      <nav class="site-nav" aria-label="주 메뉴">
        <a href="index.html" aria-current="page">집필 대시보드</a>
        <a href="counter.html">글자 수 세기</a>
      </nav>
      <header>
        <div><p class="eyebrow">Writing dashboard</p><h1>집필 기록</h1></div>
        <p class="updated" id="updated">기록을 불러오는 중…</p>
      </header>

      <section class="summary" aria-label="집필 요약">
        <article class="metric"><span>올해 누적 분량</span><strong id="year-total">–</strong></article>
        <article class="metric"><span>선택한 달</span><strong id="month-total">–</strong></article>
        <article class="metric"><span>이달 평균 작업량</span><strong id="month-average">–</strong></article>
        <article class="metric"><span>오늘</span><strong id="today-total">–</strong></article>
      </section>

      <section aria-labelledby="chart-heading">
        <div class="section-title"><h2 id="chart-heading">일별 분량</h2><div class="chart-controls"><select class="month-select" id="month-select" aria-label="조회할 달"></select><span class="period" id="period"></span></div></div>
        <div class="chart-area"><div class="chart-wrap"><canvas id="writing-chart" aria-label="이번 달 일별 글자 수 그래프"></canvas></div></div>
      </section>

      <section class="entries-section" aria-labelledby="entries-heading">
        <div class="section-title"><h2 id="entries-heading">최근 기록</h2><span class="period" id="entries-period">최근 12일</span></div>
        <div class="entries" id="entries"></div>
      </section>
      <footer>커밋 메시지 <code>ㅇㄷ:500</code> 형식의 기록만 집계합니다.</footer>
    </main>

    <script>
      const number = new Intl.NumberFormat("ko-KR");
      const fmtDate = (date) => new Intl.DateTimeFormat("ko-KR", { month: "short", day: "numeric" }).format(new Date(`${date}T12:00:00+09:00`));
      const fmtMonth = (month) => new Intl.DateTimeFormat("ko-KR", { year: "numeric", month: "long" }).format(new Date(`${month}-01T12:00:00+09:00`));
      const koreaDate = () => new Date().toLocaleDateString("sv-SE", { timeZone: "Asia/Seoul" });
      let writingChart;

      function setText(id, value) { document.getElementById(id).innerHTML = value; }
      function praiseFor(characters) {
        if (characters >= 7000) return { label: "MARVELOUS", className: "marvelous" };
        if (characters >= 6000) return { label: "PERFECT", className: "perfect" };
        if (characters >= 5000) return { label: "EXCELLENT", className: "excellent" };
        if (characters >= 4000) return { label: "GREAT", className: "great" };
        if (characters >= 3000) return { label: "GOOD", className: "good" };
        return null;
      }

      function fmtTime(timestamp) {
        return new Intl.DateTimeFormat("ko-KR", {
          timeZone: "Asia/Seoul",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
        }).format(new Date(timestamp));
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"]/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[char]);
      }
      function calendarDays(first, last) {
        const result = [];
        const cursor = new Date(`${first}T12:00:00Z`);
        const end = new Date(`${last}T12:00:00Z`);
        while (cursor <= end) {
          result.push(cursor.toISOString().slice(0, 10));
          cursor.setUTCDate(cursor.getUTCDate() + 1);
        }
        return result;
      }
      function lastDateOfMonth(month) {
        const date = new Date(`${month}-01T12:00:00Z`);
        date.setUTCMonth(date.getUTCMonth() + 1, 0);
        return date.toISOString().slice(0, 10);
      }
      function calendarMonths(first, last) {
        const result = [];
        const cursor = new Date(`${first}-01T12:00:00Z`);
        const end = new Date(`${last}-01T12:00:00Z`);
        while (cursor <= end) {
          result.push(cursor.toISOString().slice(0, 7));
          cursor.setUTCMonth(cursor.getUTCMonth() + 1);
        }
        return result;
      }
      function renderEmpty() {
        document.getElementById("entries").innerHTML = '<p class="empty">아직 집계할 기록이 없어요. 첫 커밋을 <code>ㅇㄷ:500</code>처럼 남겨 보세요.</p>';
        document.getElementById("updated").textContent = "아직 기록이 없습니다";
        ["year-total", "month-total", "month-average", "today-total"].forEach(id => setText(id, "0 <small>자</small>"));
      }
      function render(data) {
        const { days, entries, generatedAt } = data;
        if (!days.length) return renderEmpty();
        const today = koreaDate();
        const thisYear = today.slice(0, 4);
        const thisMonth = today.slice(0, 7);
        const daysByDate = new Map(days.map(day => [day.date, day]));
        const yearDays = days.filter(day => day.date.startsWith(thisYear));
        const year = yearDays.reduce((sum, day) => sum + day.characters, 0);
        const todayCount = daysByDate.get(today)?.characters ?? 0;
        const entriesByDate = entries.reduce((groups, entry) => {
          const group = groups.get(entry.date) ?? [];
          group.push(entry);
          groups.set(entry.date, group);
          return groups;
        }, new Map());
        const availableMonths = calendarMonths(entries[0].date.slice(0, 7), thisMonth);
        const defaultMonth = thisMonth;
        const monthSelect = document.getElementById("month-select");
        monthSelect.innerHTML = availableMonths.slice().reverse().map(month => `<option value="${month}">${fmtMonth(month)}</option>`).join("");
        monthSelect.value = defaultMonth;
        setText("year-total", `${number.format(year)} <small>자</small>`);
        setText("today-total", `${number.format(todayCount)} <small>자</small>`);
        document.getElementById("updated").textContent = generatedAt ? `마지막 갱신 ${new Intl.DateTimeFormat("ko-KR", { dateStyle: "medium", timeStyle: "short" }).format(new Date(generatedAt))}` : "기록을 불러왔습니다";
        function renderMonth(month) {
          const lastDate = month === thisMonth ? today : lastDateOfMonth(month);
          const monthDays = calendarDays(`${month}-01`, lastDate).map(date => daysByDate.get(date) ?? { date, characters: 0 });
          const monthTotal = monthDays.reduce((sum, day) => sum + day.characters, 0);
          const writingDays = monthDays.filter(day => day.characters > 0);
          const monthAverage = writingDays.length ? Math.round(monthTotal / writingDays.length) : 0;
          const recentDates = [...entriesByDate.keys()].filter(date => date.startsWith(month)).sort().slice(-12).reverse();
          setText("month-total", `${number.format(monthTotal)} <small>자</small>`);
          setText("month-average", `${number.format(monthAverage)} <small>자</small>`);
          document.getElementById("chart-heading").textContent = `${fmtMonth(month)} 일별 분량`;
          document.getElementById("period").textContent = `${fmtDate(monthDays[0].date)} – ${fmtDate(lastDate)}`;
          document.getElementById("entries-period").textContent = `${fmtMonth(month)} · 최근 12일`;
          document.getElementById("entries").innerHTML = recentDates.length ? recentDates.map(date => {
            let dailyTotal = 0;
            const entriesWithDailyTotals = [...entriesByDate.get(date)]
              .sort((a, b) => a.timestamp.localeCompare(b.timestamp))
              .map(entry => ({ ...entry, dailyTotal: dailyTotal += entry.characters }))
              .reverse();
            const praise = praiseFor(entriesWithDailyTotals[0].dailyTotal);
            const praiseMarkup = praise ? `<span class="praise ${praise.className}">${praise.label}</span>` : "";
            return `<section class="day-group"><h3 class="day-date"><span>${fmtDate(date)}</span>${praiseMarkup}</h3>${entriesWithDailyTotals.map(entry => `<article class="entry"><span class="commit">${escapeHtml(entry.label ?? "기록")} ${number.format(entry.characters)} · ${fmtTime(entry.timestamp)}</span><span class="words">${number.format(entry.dailyTotal)}자</span></article>`).join("")}</section>`;
          }).join("") : '<p class="empty">이 달에는 집계된 기록이 없어요.</p>';
          writingChart?.destroy();
          writingChart = new Chart(document.getElementById("writing-chart"), {
            type: "bar",
            data: { labels: monthDays.map(day => fmtDate(day.date)), datasets: [
              { label: "일별 글자 수", data: monthDays.map(day => day.characters), backgroundColor: "#7650c8", borderRadius: 4, maxBarThickness: 28 }
            ] },
            options: { responsive: true, maintainAspectRatio: false, interaction: { mode: "index", intersect: false }, plugins: { legend: { display: false }, tooltip: { callbacks: { label: context => ` ${number.format(context.raw)}자` } } }, scales: { x: { grid: { display: false }, ticks: { maxTicksLimit: 8 } }, y: { beginAtZero: true, ticks: { callback: value => `${number.format(value)}자` }, grid: { color: "#eee6e2" } } } }
          });
        }
        monthSelect.addEventListener("change", event => renderMonth(event.target.value));
        renderMonth(defaultMonth);
      }
      fetch(`./data.json?v=${Date.now()}`, { cache: "no-store" }).then(response => response.ok ? response.json() : Promise.reject()).then(render).catch(renderEmpty);
    </script>
  </body>
</html>
