<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="소설 글자 수 세기" />
    <title>글자 수 세기</title>
    <style>
      :root { color-scheme: light; --ink: #251b25; --muted: #786d78; --paper: #fffaf5; --card: #ffffff; --line: #eadfdb; --purple: #7650c8; --orange: #ea7c54; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; background: radial-gradient(circle at 90% 0, #f6e6dc 0, transparent 34rem), var(--paper); color: var(--ink); font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(1080px, calc(100% - 32px)); margin: 0 auto; padding: 68px 0 52px; }
      .site-nav { display: flex; gap: 18px; margin-bottom: 46px; font-size: .87rem; }
      .site-nav a { color: var(--muted); text-decoration: none; }
      .site-nav a:hover, .site-nav a[aria-current="page"] { color: var(--ink); font-weight: 700; }
      header { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 36px; }
      h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(2.3rem, 7vw, 4.5rem); font-weight: 500; letter-spacing: -0.065em; }
      .eyebrow { color: var(--muted); font-size: .9rem; }
      .eyebrow { margin: 0 0 8px; letter-spacing: .08em; text-transform: uppercase; }
      .editor, .metric { background: color-mix(in srgb, var(--card) 88%, transparent); border: 1px solid var(--line); }
      .editor { padding: 18px; }
      textarea { display: block; width: 100%; min-height: min(46vh, 540px); resize: vertical; border: 0; outline: 0; background: transparent; color: var(--ink); font: 1rem/1.8 Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      textarea::placeholder { color: #a59aa4; }
      .editor-footer { display: flex; justify-content: space-between; align-items: center; gap: 16px; border-top: 1px solid var(--line); padding-top: 13px; }
      .tip { color: var(--muted); font-size: .82rem; }
      button { border: 1px solid var(--line); border-radius: 0; background: var(--card); color: var(--ink); cursor: pointer; font: inherit; font-size: .84rem; padding: 8px 11px; }
      button:hover { border-color: var(--purple); color: var(--purple); }
      .summary { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 20px 0 38px; }
      .metric { min-height: 120px; padding: 20px; }
      .metric span { display: block; color: var(--muted); font-size: .86rem; }
      .metric strong { display: block; margin-top: 12px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(1.55rem, 3vw, 2.25rem); font-weight: 500; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
      footer { color: var(--muted); font-size: .8rem; margin-top: 24px; }
      @media (max-width: 700px) { main { width: min(100% - 24px, 1080px); padding-top: 30px; } .site-nav { margin-bottom: 32px; } header { display: block; } .summary { grid-template-columns: repeat(2, 1fr); } .metric { min-height: 106px; padding: 17px; } .editor { padding: 14px; } textarea { min-height: 42vh; } }
    </style>
  </head>
  <body>
    <main>
      <nav class="site-nav" aria-label="주 메뉴">
        <a href="index.html">집필 대시보드</a>
        <a href="counter.html" aria-current="page">글자 수 세기</a>
        <a href="calendar.html">발행 캘린더</a>
      </nav>

      <header>
        <div><p class="eyebrow">Writing tool</p><h1>글자 수 세기</h1></div>
      </header>

      <section class="editor" aria-label="글자 수를 셀 원고 입력">
        <textarea id="writer" placeholder="여기에 원고를 붙여 넣거나 바로 써 보세요."></textarea>
        <div class="editor-footer"><span class="tip">공백과 줄바꿈도 함께 계산할 수 있어요.</span><button type="button" id="clear">비우기</button></div>
      </section>

      <section class="summary" aria-label="글자 수 결과">
        <article class="metric"><span>공백 포함</span><strong id="with-spaces">0</strong></article>
        <article class="metric"><span>공백 제외</span><strong id="without-spaces">0</strong></article>
      </section>

      <footer>입력한 원고는 서버로 전송되거나 저장되지 않습니다.</footer>
    </main>
    <script>
      const number = new Intl.NumberFormat("ko-KR");
      const writer = document.getElementById("writer");
      const setText = (id, value) => document.getElementById(id).textContent = number.format(value);

      function countCharacters() {
        const text = writer.value;
        const withSpaces = Array.from(text).length;
        const withoutSpaces = Array.from(text.replace(/\s/g, "")).length;
        setText("with-spaces", withSpaces);
        setText("without-spaces", withoutSpaces);
      }

      writer.addEventListener("input", countCharacters);
      document.getElementById("clear").addEventListener("click", () => { writer.value = ""; writer.focus(); countCharacters(); });
      countCharacters();
    </script>
  </body>
</html>
